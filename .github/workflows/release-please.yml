name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # A PAT (not the default GITHUB_TOKEN) so that the v*.*.* tag this
          # action pushes triggers docker-publish.yml, and the release PR runs
          # CI — events created with GITHUB_TOKEN never trigger other workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          # "node" keeps the version in the root package.json and maintains
          # CHANGELOG.md; the repo releases as a single unit, not per-package.
          release-type: node
