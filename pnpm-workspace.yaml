packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  # Transitive deps of pi-ai's google/google-vertex provider support
  # (unused — dilna's provider allowlist is anthropic/deepseek/moonshotai/
  # zai only, see agents/providerConfig.ts). Their build scripts aren't
  # needed for anything dilna actually imports.
  '@google/genai': false
  protobufjs: false
  better-sqlite3: true
  esbuild: true
  lefthook: true

minimumReleaseAgeExclude:
  - '@earendil-works/chord@0.87.0'
  - '@earendil-works/pi-agent-core@0.87.0'
  - '@earendil-works/pi-ai@0.87.0'
  - '@earendil-works/pi-coding-agent@0.87.0'
  - '@earendil-works/pi-telemetry@0.87.0'
  - '@earendil-works/pi-tui@0.87.0'

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - lefthook
# Force every transitive esbuild onto a patched release: tsup and
# drizzle-kit's @esbuild-kit chain otherwise resolve versions flagged by
# GHSA-67mh-4wv8-2f99 / GHSA-g7r4-m6w7-qqqr.
overrides:
  esbuild: ^0.28.1
