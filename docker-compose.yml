services:
  dilna:
    build: .
    ports:
      - "${PORT:-3001}:3001"
    environment:
      # Selects the LLM provider/model for every session on this instance —
      # one global choice for the whole dilna instance, not a per-session
      # setting (ADR-0020). Both are required: the server refuses to start
      # if either is unset or invalid, and there is no default. Valid
      # DILNA_PROVIDER values: anthropic, deepseek, moonshotai, zai.
      - DILNA_PROVIDER=${DILNA_PROVIDER:-}
      - DILNA_MODEL=${DILNA_MODEL:-}
      # Provider API keys (ADR-0005 host-passthrough): every provider,
      # including Anthropic, authenticates via a plain API key — set only
      # the one matching DILNA_PROVIDER.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY:-}
      - ZAI_API_KEY=${ZAI_API_KEY:-}
      # GitHub CLI auth (ADR-0013, extends ADR-0005 host-passthrough):
      # generate with `gh auth login` then `gh auth token` on a machine
      # where you already have `gh` set up, or create a classic PAT at
      # https://github.com/settings/tokens with `repo` scope (add `workflow`
      # if sessions need to edit workflow files, `read:org` for org-owned
      # repos). gh reads this directly on every invocation — no
      # `gh auth login` inside the container, no mount needed. Shared by
      # every session/repo, same single-tenant model as the SSH key and
      # provider API keys above.
      - GH_TOKEN=${GH_TOKEN:-}
      # Set these to your host user's `id -u`/`id -g` if the SSH mount below
      # fails to authenticate — the container runs as an unprivileged user
      # (uid 1000 by default) and needs matching ownership to read a
      # tightly-permissioned private key. Leave unset if your host user is
      # already uid/gid 1000.
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      # dilna's own state: cloned repos, worktrees, sqlite db.
      - dilna-data:/data
      # Git auth (ADR-0005): read-only, host-provided SSH config + keys.
      # Mounted into the `dilna` user's home (the container no longer runs
      # as root — see docker-entrypoint.sh), not /root.
      - ${HOME}/.ssh:/home/node/.ssh:ro
    # Docker's default seccomp profile blocks the clone/unshare/setns calls
    # bubblewrap needs to create the user namespace behind Claude Code's
    # sandbox (ADR-0010), which would otherwise fail every session. This is
    # Podman's default profile (containers/common) — identical to Docker's
    # default except it also allows those specific namespace syscalls, so it
    # stays far narrower than `seccomp=unconfined`.
    security_opt:
      - seccomp=./seccomp-bubblewrap.json

volumes:
  dilna-data:
